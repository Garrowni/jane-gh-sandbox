name: pr-with-app
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "branch to open a PR from (e.g. demo-app-1)"
        required: true
permissions:
  contents: read
jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # __APPTOKEN_VER__
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read # no PR permission yet
        - env:
            GH_TOKEN: ${{ steps.app-token.outputs.token }}
          run: |
            gh pr create --repo "${{ github.repository }}" \
              --head "${{ inputs.branch }}" \
              --base "${{ github.event.repository.default_branch }}" \
              --title "Demo PR from ${{ inputs.branch ||" --body "Opened by the app"
